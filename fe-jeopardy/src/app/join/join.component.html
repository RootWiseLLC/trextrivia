<div class='join-backdrop'></div>

<div class='join-page'>
    <section class='hero'>
        <div class='logo-ring'>
            <img src="assets/graphic.jpg" alt="T-Rex Trivia logo">
        </div>
        <p class='tagline'>Over 100,000 real clues. Play with friends or take on the bots.</p>
        <p class='dedication' *ngIf="showDedication">Made with love for Tera <ion-icon name="heart"></ion-icon></p>
    </section>

    <section class='card'>
        <div class='field'>
            <label class='section-label' for='player-name-join' *ngIf="!user.authenticated">Your name</label>
            <input *ngIf="!user.authenticated" id="player-name-join" type="text" [class.invalid]="nameInvalid"
                [(ngModel)]="user.name" placeholder="Enter your name" autocomplete="nickname">
            <p class='welcome' *ngIf="user.authenticated">Welcome back, <b>{{user.name}}</b></p>
        </div>

        <div class='field'>
            <span class='section-label'>Game style</span>
            <div class='style-options' role='radiogroup'>
                <button type='button' role='radio' class='style-option' [class.selected]="oneRoundChecked"
                    [attr.aria-checked]="oneRoundChecked" (click)="setRounds(1)">
                    <ion-icon name="flash-outline"></ion-icon>
                    <span class='option-title'>Quick</span>
                    <span class='option-desc'>1 round</span>
                </button>
                <button type='button' role='radio' class='style-option' [class.selected]="twoRoundChecked"
                    [attr.aria-checked]="twoRoundChecked" (click)="setRounds(2)">
                    <ion-icon name="trophy-outline"></ion-icon>
                    <span class='option-title'>Full game</span>
                    <span class='option-desc'>2 rounds</span>
                </button>
            </div>

            <label class='toggle' for='penalty-input'>
                <span class='toggle-text'>
                    <span class='option-title'>Penalty for wrong answers</span>
                </span>
                <input type="checkbox" id="penalty-input" [(ngModel)]="penaltyChecked">
                <span class='switch' aria-hidden='true'></span>
            </label>
        </div>

        <div class='actions'>
            <button class='primary-action' (click)="createPrivateGame(0)">
                <ion-icon name="play"></ion-icon> Start a new game
            </button>
            <button class='secondary-action' (click)="createPrivateGame(2)">
                <ion-icon name="hardware-chip-outline"></ion-icon> Play against bots
            </button>
        </div>

        <div class='divider'><span>or join a friend</span></div>

        <div class='join-code'>
            <input id="game-code" type="text" [(ngModel)]="joinCode" (keydown.enter)="joinGameByCode()"
                placeholder="Game code" aria-label="Game code">
            <button (click)="joinGameByCode()">Join</button>
        </div>
        <p class='hint'>The host can see the code on their "Waiting to start" screen.</p>

        <div class='footer-links'>
            <button class='text-link' (click)="modal.displayConfig()">
                <ion-icon name="options-outline"></ion-icon> Advanced options
            </button>
            <button class='text-link' (click)="rejoin()">
                <ion-icon name="refresh-outline"></ion-icon> Disconnected? Rejoin
            </button>
        </div>
    </section>
</div>

<app-config *ngIf="modal.showConfig()" [user]="user" [oneRoundChecked]="oneRoundChecked" [twoRoundChecked]="twoRoundChecked" [penaltyChecked]="penaltyChecked"></app-config>
